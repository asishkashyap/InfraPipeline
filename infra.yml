trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: TerraformInstaller@1
  displayName: "Terraform Tool Installer"
  inputs:
    terraformVersion: 'latest'
  
- task: TerraformTask@5
  displayName: "Terraform INIT"
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/Class5-modules/parent_module'
    backendServiceArm: 'azureportal'
    backendAzureRmResourceGroupName: 'rg-terraformstate'
    backendAzureRmStorageAccountName: 'devops218912'
    backendAzureRmContainerName: 'tfstate'
    backendAzureRmKey: 'dhondhu.tfstate'

- task: TerraformTask@5
  displayName: "Terraform Validate"
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)/Class5-modules/parent_module'

- task: tfsec@1
  displayName: "Security Code Scan"
  inputs:
    version: 'v1.26.0'
    debug: true
    dir: '$(System.DefaultWorkingDirectory)/Class5-modules'

- task: TerraformTask@5
  displayName: "Terraform Plan"
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)/Class5-modules/parent_module'
    environmentServiceNameAzureRM: 'azureportal'


# - task: ManualValidation@1
#   inputs:

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(System.DefaultWorkingDirectory)/Class5-modules/parent_module'
    environmentServiceNameAzureRM: 'azureportal'
